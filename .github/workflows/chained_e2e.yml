name: 'Testing: E2E (Chained)'
on:
  workflow_run:
    workflows: ['Trigger E2E']
    types: ['completed']
permissions:
  contents: 'read'
  statuses: 'write'
jobs:
  download_repo_name:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' }}
    outputs:
      repo_name: '${{ steps.o.outputs.repo_name }}'
      head_sha: '${{ steps.o.outputs.head_sha }}'
    steps:
      - name: Download the repo_name artifact
        uses: actions/download-artifact@v5
        env:
          RUN_ID: '${{ github.event.workflow_run.id }}'
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          name: repo_name
          run-id: '${{ env.RUN_ID }}'
          path: '${{ runner.temp }}/artifacts'
      - id: o
        uses: actions/github-script@v7
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          script: |
            const fs=require('fs'),path=require('path');
            const t='${{ runner.temp }}/artifacts';
            const rp=path.join(t,'repo_name'); if(fs.existsSync(rp)) core.setOutput('repo_name', String(fs.readFileSync(rp)).trim());
            const sp=path.join(t,'head_sha'); if(fs.existsSync(sp)) core.setOutput('head_sha', String(fs.readFileSync(sp)).trim());
  parse_run_context:
    runs-on: ubuntu-latest
    needs: download_repo_name
    if: ${{ always() }}
    outputs:
      repository: '${{ steps.c.outputs.REPO }}'
      sha: '${{ steps.c.outputs.SHA }}'
    steps:
      - id: c
        env:
          REPO: '${{ needs.download_repo_name.outputs.repo_name || github.repository }}'
          SHA: '${{ needs.download_repo_name.outputs.head_sha || github.event.workflow_run.head_sha || github.sha }}'
        run: |
          echo "REPO=$REPO" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
  e2e_linux:
    needs: parse_run_context
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: '${{ needs.parse_run_context.outputs.sha }}'
          repository: '${{ needs.parse_run_context.outputs.repository }}'
          persist-credentials: false
	      allow-unsafe-pr-checkout: true
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build --if-present
      - name: Run E2E tests
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
        run: npm run test:integration:sandbox:none
